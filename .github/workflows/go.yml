name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Build for Windows and Linux
        run: |
          GOOS=windows GOARCH=amd64 go build -o myapp-windows-amd64.exe -v .
          GOOS=linux   GOARCH=amd64 go build -o myapp-linux-amd64   -v .

      - name: Test
        run: go test -v ./...

      - name: Create / Update Latest Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Latest Release"
          draft: false
          prerelease: false
          files: |
            myapp-windows-amd64.exe
            myapp-linux-amd64
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}