name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:              # ✅ 放在这里，与 runs-on 同级
      contents: write         # 授予写入 Release 的权限
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      # - name: Build for Windows and Linux
      #   run: |
      #     GOOS=windows GOARCH=amd64 go build -o myapp-windows-amd64.exe -v .
      #     GOOS=linux   GOARCH=amd64 go build -o myapp-linux-amd64   -v .
      - name: Build for Windows and Linux
        run: |
          GOOS=windows GOARCH=amd64 go build -o myapp-windows-amd64.exe -v ./cmd/gho
          GOOS=linux   GOARCH=amd64 go build -o myapp-linux-amd64   -v ./cmd/gho
      - name: Test
        run: go test -v ./...

      - name: Create / Update Latest Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest
          file: myapp-*
          file_glob: true
          overwrite: true
          body: "Latest build from main branch"
          release_name: "Latest Release"
          draft: false
          prerelease: false