name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    contents: write          # 添加这行，授予对仓库内容的写入权限

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Build for Windows and Linux
        run: |
          GOOS=windows GOARCH=amd64 go build -o myapp-windows-amd64.exe -v .
          GOOS=linux   GOARCH=amd64 go build -o myapp-linux-amd64   -v .

      - name: Test
        run: go test -v ./...

      - name: Create / Update Latest Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest                    # 固定标签
          file: myapp-*                  # 匹配两个二进制文件
          file_glob: true                # 启用通配符
          overwrite: true                # ✅ 覆盖已有资产
          body: "Latest build from main branch"  # 可选，Release 描述
          release_name: "Latest Release" # 可选
          draft: false
          prerelease: false